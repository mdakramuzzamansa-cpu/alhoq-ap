name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          cat << 'EOF' > project.yml
          name: Alhoq
          options:
            bundleIdPrefix: com.alhoq
            deploymentTarget:
              iOS: "17.0"
          targets:
            Alhoq:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: .
                  excludes:
                    - ".github"
                    - "build"
                    - "project.yml"
                    - "*.xcodeproj"
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Patch pbxproj object version for Xcode 15 compatibility
        run: |
          PBXPROJ="Alhoq.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            echo "Before:"; grep objectVersion "$PBXPROJ"
            sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' "$PBXPROJ"
            echo "After:"; grep objectVersion "$PBXPROJ"
          fi

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Alhoq.xcodeproj \
            -scheme Alhoq \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

      - name: Package .app for Appetize
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Alhoq-Simulator.zip" Alhoq.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alhoq-Simulator
          path: Alhoq-Simulator.zip
          retention-days: 14
