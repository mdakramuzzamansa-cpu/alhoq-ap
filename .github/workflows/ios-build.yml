name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml is committed in the repo (with GENERATE_INFOPLIST_FILE,
      # code-signing settings, permission strings, etc.) — do NOT recreate
      # it here. A previous version of this workflow overwrote it with a
      # stripped-down inline copy, which is what caused the Info.plist
      # build failures.

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Fix accentColor foregroundStyle error
        run: |
          FILE="Views/Listings/ListingDetailView.swift"
          if [ -f "$FILE" ]; then
            sed -i '' 's/\.foregroundStyle(\.accentColor)/\.foregroundStyle(\.accent)/g' "$FILE"
            echo "Fixed ListingDetailView.swift"
          fi

      # No objectVersion patch: the runner uses Xcode 16.4, which reads
      # XcodeGen's format-77 project natively. Downgrading it was only
      # needed back when the runner picked Xcode 15.4, and doing it now
      # actively breaks the build (that's what caused the Info.plist error).

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Alhoq.xcodeproj \
            -scheme Alhoq \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app for Appetize
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Alhoq-Simulator.zip" Alhoq.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alhoq-Simulator
          path: Alhoq-Simulator.zip
          retention-days: 14
