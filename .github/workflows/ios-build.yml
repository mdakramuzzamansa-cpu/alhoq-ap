- name: Patch known SwiftUI toolbar ambiguity issues
        run: |
          python3 - << 'PYEOF'
          import os
          
          def write(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"created {path}")
          
          def replace(path, old, new, required=True):
              if not os.path.isfile(path):
                  print(f"skip (missing): {path}")
                  return
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              if old not in content:
                  if new in content:
                      print(f"already patched: {path}")
                  else:
                      msg = f"PATTERN NOT FOUND in {path}"
                      if required:
                          raise SystemExit(msg)
                      print(msg)
                  return
              content = content.replace(old, new)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"patched: {path}")
          
          # 1) shared helper file
          write("Alhoq/Extensions/ToolbarHelpers.swift", '''import SwiftUI
          
          @ToolbarContentBuilder
          func cancelToolbarItem(_ title: String, action: @escaping () -> Void) -> some ToolbarContent {
              ToolbarItem(placement: .cancellationAction) {
                  Button(title, action: action)
              }
          }
          
          @ToolbarContentBuilder
          func toolbarItem<Content: View>(
              placement: ToolbarItemPlacement,
              @ViewBuilder content: @escaping () -> Content
          ) -> some ToolbarContent {
              ToolbarItem(placement: placement, content: content)
          }
          
          @ToolbarContentBuilder
          func toolbarItemGroup<Content: View>(
              placement: ToolbarItemPlacement,
              @ViewBuilder content: @escaping () -> Content
          ) -> some ToolbarContent {
              ToolbarItemGroup(placement: placement, content: content)
          }
          ''')
          
          # 2) simple single-line cancel-button replacements (global per file)
          single_line_files = [
              "Alhoq/Views/Rooms/RoomThreadView.swift",
              "Alhoq/Views/Rooms/RoomListViews.swift",
              "Alhoq/Views/Rooms/RoomParticipantsSheet.swift",
              "Alhoq/Views/Reviews/ReviewSubmitView.swift",
              "Alhoq/Views/Booking/BookingCreateView.swift",
              "Alhoq/Views/EscrowMarket/EscrowMarketViews.swift",
              "Alhoq/Views/Orders/OrderDetailView.swift",
              "Alhoq/Views/Orders/OrderCreateView.swift",
              "Alhoq/Views/Chat/InboxView.swift",
              "Alhoq/Views/Anonymous/AnonymousViews.swift",
              "Alhoq/Views/CustomForm/FormFillView.swift",
              "Alhoq/Views/Handshake/HandshakeViews.swift",
              "Alhoq/Views/Feed/FeedViews.swift",
          ]
          for f in single_line_files:
              if os.path.isfile(f):
                  with open(f, encoding="utf-8") as fh:
                      c = fh.read()
                  c2 = c.replace(
                      'ToolbarItem(placement: .cancellationAction) { Button("বাতিল") { dismiss() } }',
                      'cancelToolbarItem("বাতিল") { dismiss() }')
                  c2 = c2.replace(
                      'ToolbarItem(placement: .cancellationAction) { Button("বন্ধ করুন") { dismiss() } }',
                      'cancelToolbarItem("বন্ধ করুন") { dismiss() }')
                  if c2 != c:
                      with open(f, "w", encoding="utf-8") as fh:
                          fh.write(c2)
                      print(f"patched (single-line pass): {f}")
              else:
                  print(f"skip (missing): {f}")
          
