name: Alhoq

options:
  bundleIdPrefix: com.alhoq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  Alhoq:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - ".github"
          - "build"
          - "project.yml"
          - "*.xcodeproj"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alhoq.Alhoq
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ONLY_ACTIVE_ARCH: "NO"
        
        # Modern auto-generated Info.plist settings (No physical Info.plist required)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alhoq
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait,UIInterfaceOrientationLandscapeLeft,UIInterfaceOrientationLandscapeRight"
        
        # Permission strings
        INFOPLIST_KEY_NSCameraUsageDescription: "ভিডিও কল/লাইভ স্ট্রিমের জন্য ক্যামেরা দরকার।"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "কল/লাইভ/ভয়েস মেসেজের জন্য মাইক্রোফোন দরকার।"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "আপনার ভয়েস মেসেজ টেক্সটে রূপান্তর করতে এটা লাগে।"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ছবি/ভিডিও বেছে নেওয়ার জন্য গ্যালারি অ্যাক্সেস দরকার।"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "আপনার এলাকা অনুযায়ী সঠিক ফলাফল দেখাতে লোকেশন দরকার।"
        
        # Allow HTTP dev connections if needed
        INFOPLIST_KEY_NSAppTransportSecurity: "NSAllowsArbitraryLoads"
